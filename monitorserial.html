  if (!localStorage.getItem('loggedIn')) {

        var port, textEncoder, writableStreamClosed, writer, historyIndex = -1;
        const lineHistory = [];
        let autoScrollEnabled = true;

        const serialResultsDiv = document.getElementById("serialResults");

        document.getElementById("autoScroll").addEventListener("change", function () {
            autoScrollEnabled = this.checked;
        });

        async function connectSerial() {
            try {
                   
                port = await navigator.serial.requestPort();
                await port.open({ baudRate: document.getElementById("baud").value });
                let settings = {};

                if (localStorage.dtrOn == "true") settings.dataTerminalReady = true;
                if (localStorage.rtsOn == "true") settings.requestToSend = true;
                if (Object.keys(settings).length > 0) await port.setSignals(settings);

                textEncoder = new TextEncoderStream();
                writableStreamClosed = textEncoder.readable.pipeTo(port.writable);
                writer = textEncoder.writable.getWriter();
                await listenToPort();
            } catch (e) {
                alert("Serial Connection Failed: " + e);
            }
        }

        async function sendSerialLine() {
            let dataToSend = document.getElementById("lineToSend").value;
            lineHistory.unshift(dataToSend);
            historyIndex = -1;
            if (document.getElementById("carriageReturn").checked) dataToSend += "\r";
            if (document.getElementById("addLine").checked) dataToSend += "\n";
            if (document.getElementById("echoOn").checked) appendToTerminal("> " + dataToSend);
            await writer.write(dataToSend);
            if (dataToSend.trim().startsWith('\x03')) echo(false);
            document.getElementById("lineToSend").value = "";
        }

        async function sendScanCommand() {
          
            serialResultsDiv.innerHTML = ''; // Limpiar el monitor

          // Cambiar el fondo eliminando la imagen y poniendo color sólido
          serialResultsDiv.style.background = 'rgb(88, 92, 92)';

            let dataToSend = "{\"c\":scan}\n";
            await writer.write(dataToSend);
            appendToTerminal("> ");
             
        }

        async function listenToPort() {
            const textDecoder = new TextDecoderStream();
            const readableStreamClosed = port.readable.pipeTo(textDecoder.writable);
            const reader = textDecoder.readable.getReader();

            while (true) {
                const { value, done } = await reader.read();
                if (done) {
                    console.log('[readLoop] DONE', done);
                    reader.releaseLock();
                    break;
                }
                appendToTerminal(value);
            }
        }

        function appendToTerminal(newStuff) {
            serialResultsDiv.innerHTML += newStuff;
            if (serialResultsDiv.innerHTML.length > 3000)
                serialResultsDiv.innerHTML = serialResultsDiv.innerHTML.slice(serialResultsDiv.innerHTML.length - 3000);

            if (autoScrollEnabled)
                serialResultsDiv.scrollTop = serialResultsDiv.scrollHeight;
        }

        function scrollHistory(direction) {
            historyIndex = Math.max(Math.min(historyIndex + direction, lineHistory.length - 1), -1);
            if (historyIndex >= 0) {
                document.getElementById("lineToSend").value = lineHistory[historyIndex];
            } else {
                document.getElementById("lineToSend").value = "";
            }
        }

        function saveToFile() {
            const textToSave = document.getElementById("serialResults").innerText;
            const blob = new Blob([textToSave], { type: "text/plain" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = "monitor_serial.txt";
            a.click();
            URL.revokeObjectURL(url);
        }

        document.getElementById("lineToSend").addEventListener("keyup", async function (event) {
            if (event.keyCode === 13) {
                sendSerialLine();
            } else if (event.keyCode === 38) {
                scrollHistory(1);
            } else if (event.keyCode === 40) {
                scrollHistory(-1);
            }
        });

        document.getElementById("baud").value = (localStorage.baud == undefined ? 9600 : localStorage.baud);
        document.getElementById("addLine").checked = (localStorage.addLine == "false" ? false : true);
        document.getElementById("carriageReturn").checked = (localStorage.carriageReturn == "false" ? false : true);
        document.getElementById("echoOn").checked = (localStorage.echoOn == "false" ? false : true);
    </script>

// Inicializa marcas
brandOptions.forEach(brand => {
  const option = document.createElement('option');
  option.value = brand;
  option.textContent = brand;
  brandSelect.appendChild(option);
});

brandSelect.addEventListener('change', () => {
  modelSelect.innerHTML = '<option value="">Selecciona un modelo</option>';
  modelSelect.disabled = true;
  i2cSelect.innerHTML = '<option value="">Selecciona RFFE</option>';
  i2cSelect.disabled = true;
  summaryText.value = '';

  const selectedBrand = brandSelect.value;
  if (selectedBrand && modelOptions[selectedBrand]) {
    modelOptions[selectedBrand].forEach(model => {
      const option = document.createElement('option');
      option.value = model;
      option.textContent = model;
      modelSelect.appendChild(option);
    });
    modelSelect.disabled = false;
  }
});

modelSelect.addEventListener('change', () => {
  i2cSelect.innerHTML = '<option value="">Selecciona RFFE</option>';
  i2cSelect.disabled = true;
  summaryText.value = '';

  const selectedModel = modelSelect.value;
  if (selectedModel && i2cDetailsByModel[selectedModel]) {
    const i2cKeys = Object.keys(i2cDetailsByModel[selectedModel]);
    i2cKeys.forEach(key => {
      const option = document.createElement('option');
      option.value = key;
      option.textContent = key;
      i2cSelect.appendChild(option);
    });
    i2cSelect.disabled = false;
  }
});

i2cSelect.addEventListener('change', () => {
  const selectedModel = modelSelect.value;
  const selectedI2C = i2cSelect.value;
  if (selectedModel && selectedI2C && i2cDetailsByModel[selectedModel][selectedI2C]) {
    summaryText.value = i2cDetailsByModel[selectedModel][selectedI2C].join('\n');
  } else {
    summaryText.value = '';
  }
});

resetButton.addEventListener('click', () => {
  brandSelect.selectedIndex = 0;
  modelSelect.innerHTML = '<option value="">Selecciona un modelo</option>';
  modelSelect.disabled = true;
  i2cSelect.innerHTML = '<option value="">Selecciona RFFE</option>';
  i2cSelect.disabled = true;
  summaryText.value = '';
});

</script>
